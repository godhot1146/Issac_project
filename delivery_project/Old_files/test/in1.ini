# -----------------------------------------------------------------
    # 🤖 2. LiftingAMR FSM 시퀀스 제어 루프 (신규 상태 기계 전개 파트)
    # -----------------------------------------------------------------
    if tote_current_state == LIFT_AMR_STATE_IDLE:
        lifting_amr.set_twist_velocity(0.0, 0.0)

    elif tote_current_state == LIFT_AMR_STATE_BACKWARD_ESCAPE:
        lifting_amr.set_lift_height(0.6)
        tote_arrived = lifting_amr.move_to_point(tote_target_x, tote_target_y, backward=True)
        if tote_arrived:
            tote_current_state = LIFT_AMR_STATE_shuttle_rotation1

    elif tote_current_state == LIFT_AMR_STATE_shuttle_rotation1:
        lifting_amr.set_twist_velocity(0.0, 0.0) 
        current_rot = lifting_amr.get_shuttle_rotation()
        rot_target = 1.5708
        lifting_amr.set_shuttle_rotation(rot_target)
        if abs(rot_target - current_rot) < ROT_THRESHOLD:
            # 💡 [핵심 수정] 셔틀 회전이 끝나면 상자를 집기 전에 키보드 제어 상태로 토스합니다.
            print("\n[안내] 셔틀 정렬 완료 ➡️ 수동 미세조정 모드 활성화 (W: 전진, S: 후진, SPACE: 완료)")
            tote_current_state = LIFT_AMR_STATE_MANUAL_TUNING

    # 💡 [핵심 수정] drive_along_axis의 제어 원리를 차용해 단순 전진/후진 제어 주입
    elif tote_current_state == LIFT_AMR_STATE_MANUAL_TUNING:
        if manual_linear_cmd > 0:
            # W 키: 로봇 로컬 정면 방향으로 전진 (+속도, 조향 각속도 0.0 고정)
            lifting_amr.set_twist_velocity(linear_x=manual_linear_cmd, angular_z=0.0)
        elif manual_linear_cmd < 0:
            # S 키: 로봇 로컬 후면 방향으로 후진 (-속도, 조향 각속도 0.0 고정)
            lifting_amr.set_twist_velocity(linear_x=manual_linear_cmd, angular_z=0.0)
        else:
            # 키 입력이 없을 때: 완전 정지 키핑
            lifting_amr.set_twist_velocity(0.0, 0.0)

        # 실시간 좌표 디버그 출력 (numpy.void 및 딕셔너리 구조 안전 방어)
        if frame_count % 60 == 0:
            p, _ = lifting_amr.get_pose()
            px = p['x'] if isinstance(p, dict) else (p.x if hasattr(p, 'x') else p[0])
            py = p['y'] if isinstance(p, dict) else (p.y if hasattr(p, 'y') else p[1])
            print(f"[수동 튜닝 모드 주행 중] 로봇 현재 실시간 좌표 X: {px:.4f}m / Y: {py:.4f}m", end='\r')       

    elif tote_current_state == LIFT_AMR_STATE_extension:
        current_fork = lifting_amr.get_fork_extension()
        fork_target = 0.95
        lifting_amr.set_fork_extension(fork_target)
        claw_target = 0.8 
        lifting_amr.set_claw_grip(claw_target)
        if abs(fork_target - current_fork) < FORK_THRESHOLD:
            tote_current_state = LIFT_AMR_STATE_close

    elif tote_current_state == LIFT_AMR_STATE_close:
        current_left_claw, _ = lifting_amr.get_claw_positions()
        claw_target = -0.8 
        lifting_amr.set_claw_grip(claw_target)
        if abs(claw_target - current_left_claw) < CLAW_THRESHOLD:
            tote_current_state = LIFT_AMR_STATE_extension2

    elif tote_current_state == LIFT_AMR_STATE_extension2:
        current_fork = lifting_amr.get_fork_extension()
        fork_target = 0.0 
        lifting_amr.set_fork_extension(fork_target)
        if abs(fork_target - current_fork) < FORK_THRESHOLD:
            print("끝! LIFT_AMR_STATE_TASK_COMPLETE ")                   
            tote_current_state = LIFT_AMR_STATE_TASK_COMPLETE

    elif tote_current_state == LIFT_AMR_STATE_TASK_COMPLETE:
        lifting_amr.set_twist_velocity(0.0, 0.0)